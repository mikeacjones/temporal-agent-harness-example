apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-harness-redis-testing
  namespace: temporal-michaelj-agent-harness-demo
  labels:
    app: agent-harness-testing
    component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agent-harness-testing
      component: redis
  template:
    metadata:
      labels:
        app: agent-harness-testing
        component: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              umask 077
              printf 'requirepass %s\n' "$SIMPLE_CHAT_STREAM_TOKEN" > /run/redis/redis.conf
              exec redis-server /run/redis/redis.conf --appendonly yes --appendfsync everysec --dir /data
          env:
            - name: SIMPLE_CHAT_STREAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-harness-secrets
                  key: SIMPLE_CHAT_STREAM_TOKEN
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: agent-harness-secrets
                  key: SIMPLE_CHAT_STREAM_TOKEN
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /run/redis
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 999
      volumes:
        - name: data
          # The sa-demo cluster has no EBS CSI provisioner. AOF survives
          # container restarts in this pod; workflow state remains the durable
          # source of truth if the Redis pod itself is replaced.
          emptyDir: {}
        - name: config
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: agent-harness-redis-testing
  namespace: temporal-michaelj-agent-harness-demo
  labels:
    app: agent-harness-testing
    component: redis
spec:
  type: ClusterIP
  selector:
    app: agent-harness-testing
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
